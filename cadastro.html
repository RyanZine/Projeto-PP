<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pequenos Programadores - Cadastro</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>
    <a href="pequenos_programadores.html" class="logo-link">🤖 Pequenos Programadores</a>
    <span>💡</span>
  </h1>
  </header>

  <div class="bubble small"></div>
  <div class="bubble medium"></div>
  <div class="bubble large"></div>

  <div class="login-container">
  <form action="/submit" method="post">
    <h2>Cadastre-se!</h2>

    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

    <label for="usuario">Usuário:</label>
    <input type="text" id="usuario" name="usuario" placeholder="Escolha um usuário" required>

    <label for="responsavel">Responsável:</label>
    <input type="text" id="responsavel" name="responsavel" placeholder="Nome do responsável" required>

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

    <label for="email_responsavel">E-mail do Responsável:</label>
    <input type="email" id="email_responsavel" name="email_responsavel" placeholder="E-mail do responsável" required>

    <label for="senha">Senha:</label>
    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>

    <label for="nivel_escolar">Nível de Escolaridade:</label>
    <select id="nivel_escolar" name="nivel_escolar" required>
      <option value="fundamental">Ensino Fundamental</option>
      <option value="fundamental2">Ensino Fundamental II</option>
    </select>

    <button type="submit">Cadastrar</button>

    <p class="footer-text">
      Já possui cadastro? <a href="login.html" class="cadastro-link">Faça login</a><br>
      É professor? <a href="login_professores.html" class="professor-link">Login Professores</a>
    </p>
  </form>
</div>
