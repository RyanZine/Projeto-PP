<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>PP-Cadastro</title>
</head>
<header>
    <h1>Pequenos Programadores</h1>
</header>
<body>
    <!--Cadastro-->
    <script src="pequenos_programadores.js"></script>
    <div>
    <h2>Cadastro</h2>
    <section>
    <form action="/submit" method="post">
        <label for="name">Nome:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="username">Usuário:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="name">Responsável:</label>
        <input type="text" id="responsavel" name="responsavel" required><br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="email">E-mail do Responsável:</label>
        <input type="email" id="email_responsavel" name="email_responsavel" required><br><br>

        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" required><br><br>

        <label for="school_level">Nível de Escolaridade:</label>
        <select id="school_level" name="school_level" required><br>
            <option value="fundamental">Ensino Fundamental</option>
            <option value="fundamentel2">Ensino Fundamental II</option>

        <button type="submit">Cadastrar</button>
        <p>Eu concordo com os termos de uso e política </p>
    </form>
    </section>
    </div>
    <!--Link para Login-->
    <section>
        <p>Já possui cadastro? <a href="login.html">Clique aqui</a> para fazer login.</p>
    </section>
    <!--Rodapé-->
    <section>
        <footer>
            <p>&copy; 2025 Pequenos Programadores. Todos os direitos reservados.</p>
        </footer>
</body>
</html>
