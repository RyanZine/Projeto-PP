<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pequenos Programadores - Cadastro Professores</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🤖 Pequenos Programadores <span>💡</span></h1>
  </header>

  <div class="bubble small"></div>
  <div class="bubble medium"></div>
  <div class="bubble large"></div>

  <div class="login-container">
    <h2>Cadastro Professores</h2>
    <form action="/submit" method="post">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

      <label for="usuario">Usuário:</label>
      <input type="text" id="usuario" name="usuario" placeholder="Escolha um usuário" required>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>

      <button type="submit">Cadastrar</button>
    </form>
    <p class="footer-text">
      Já possui cadastro? <a href="login_professores.html">Faça login</a>
    </p>
  </div>

</body>
</html>
