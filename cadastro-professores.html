<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadstro_Professor</title>
</head>
<header>Pequenos Programadores</header>
<body>
    <!--Cadastro-->
    <div>
    <h2>Cadastro - Professores</h2>
    <section>
    <form action="/submit" method="post">
        <label for="name">Nome:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="username">Usuário:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" required><br><br>

        <button type="submit">Cadastrar</button>
        <p>Eu concordo com os termos de uso e política </p>
    </form>
    </section>
    </div>
    <!--Link para Login-->
    <section>
        <p>Já possui cadastro? <a href="login_professores.html">Clique aqui</a> para fazer login.</p>
    </section>
    <!--Rodapé-->
    <section>
        <footer>
            <p>&copy; 2025 Pequenos Programadores. Todos os direitos reservados.</p>
        </footer>
     
</body>
</html>
