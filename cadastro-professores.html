<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cadastro de professores — junte-se à equipe Pequenos Programadores e ensine programação de forma criativa.">
  <title>Pequenos Programadores - Cadastro Professores</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="pequenos_programadores.js" defer></script>
</head>
<body>
    <!-- Círculos animados -->
    <div class="animated-circle circle-1"></div>
    <div class="animated-circle circle-2"></div>
    <div class="animated-circle circle-3"></div>

  <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
  <header class="header-main">
    <h1>
      <a href="pequenos_programadores.html" class="logo-link">
        <img src="logo.png" alt="Logo Pequenos Programadores" class="logo" width="120" height="60">
        <span>Pequenos Programadores</span>
      </a>
    </h1>
  </header>

  <main id="main-content">
    <div class="bubble small"></div>
    <div class="bubble medium"></div>
    <div class="bubble large"></div>

    <div class="login-container">
      <h2>Cadastro Professores</h2>
      <form action="/submit" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

        <label for="usuario">Usuário:</label>
        <input type="text" id="usuario" name="usuario" placeholder="Escolha um usuário" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>

        <button type="submit">Cadastrar</button>
      </form>
      <p class="footer-text">
        Já possui cadastro? <a href="login_professores.html">Faça login</a>
      </p>
    </div>
  </main>
  </div>
   <!--Rodapé-->
    <footer>
        <p>&copy; 2025 Pequenos Programadores. Todos os direitos reservados.</p>
        <p><a href="termos.html">Política de Privacidade</a>
    </footer>

</body>
</html>
