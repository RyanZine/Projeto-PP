<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pequenos Programadores - Login Professores</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🤖 Pequenos Programadores <span>💡</span></h1>
  </header>

  <div class="bubble small"></div>
  <div class="bubble medium"></div>
  <div class="bubble large"></div>

 <div class="login-container">
  <form action="/login" method="post">
    <h2>Bem-vindo(a)!</h2>

    <label for="usuario">Usuário:</label>
    <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" required>

    <label for="senha">Senha:</label>
    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

    <button type="submit">Entrar</button>

    <p class="footer-text">
      Novo por aqui? <a href="cadastro.html" class="cadastro-link">Cadastre-se</a><br>
      É professor? <a href="login_professores.html" class="professor-link">Login para Professores</a>
    </p>
  </form>
</div>
